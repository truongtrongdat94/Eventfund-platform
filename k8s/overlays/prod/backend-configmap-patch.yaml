apiVersion: v1
kind: ConfigMap
metadata:
  name: eventfund-backend-config
data:
  NODE_ENV: "PROD"
  PORT: "4000"
  LOG_LEVEL: "info"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  AUTH_RATE_LIMIT_MAX: "5"
  MIN_DEPOSIT_VND: "100000"
  MAX_DEPOSIT_VND: "50000000"
  DEPOSIT_ORDER_EXPIRY_MINUTES: "15"
  AUTO_EVENT_LIFECYCLE_ENABLED: "true"
  AUTO_EVENT_LIFECYCLE_INTERVAL_MS: "60000"
  AUTO_EVENT_LIFECYCLE_SCAN_LIMIT: "50"
  AUTO_TICKETING_DEFAULT_TYPE: "standard"
  CHAIN_LOG_CHUNK_SIZE: "500"
  JWT_EXPIRES_IN: "7d"
  SIWE_CHAIN_ID: "11155111"
  DELEGATED_SIG_CHAIN_ID: "11155111"
  DELEGATED_SIG_DOMAIN_NAME: "EventFund"
  DELEGATED_SIG_DOMAIN_VERSION: "1"
  RELAYER_REQUIRE_CREATE_EVENT_SIGNATURE: "true"
  RELAYER_REQUIRE_ADMIN_STATUS_SIGNATURE: "true"
  CONTRACTS_ARTIFACTS_DIR: "./artifacts"
  WEB3AUTH_NETWORK: "sapphire_devnet"
