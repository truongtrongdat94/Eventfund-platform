apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eventfund-dev
  namespace: argocd
  labels:
    environment: dev
spec:
  project: default
  source:
    repoURL: https://github.com/truongtrongdat94/Eventfund-platform.git
    targetRevision: dev  # Dev environment uses dev branch
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: eventfund-dev
  syncPolicy:
    automated:
      prune: true      # xóa resource không còn trong Git
      selfHeal: true   # tự fix nếu ai đó sửa trực tiếp trên cluster
    syncOptions:
      - CreateNamespace=true
