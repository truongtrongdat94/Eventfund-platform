name: Manual – Infrastructure Apply

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "apply" to confirm'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  apply-persistent:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'apply'
    timeout-minutes: 30
    
    environment: production-infra

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Load config
        id: config
        uses: ./.github/actions/load-config

      - name: Configure AWS
        uses: ./.github/actions/setup-aws
        with:
          aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Setup Terraform plugin cache directory
        run: |
          mkdir -p ~/.terraform.d/plugin-cache
          echo 'plugin_cache_dir = "$HOME/.terraform.d/plugin-cache"' > ~/.terraformrc

      - name: Cache Terraform plugins
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-plugins-${{ runner.os }}-${{ hashFiles('terraform/**/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-plugins-${{ runner.os }}-

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.config.outputs.terraform_version }}
          terraform_wrapper: false

      - name: Generate terraform.auto.tfvars.json
        uses: ./.github/actions/generate-terraform-tfvars
        with:
          aws_region: ${{ steps.config.outputs.aws_region }}
          project_name: ${{ steps.config.outputs.project_name }}
          environment: ${{ steps.config.outputs.environment }}
          vpc_cidr: ${{ steps.config.outputs.tf_vpc_cidr }}
          public_subnets_cidr: ${{ steps.config.outputs.tf_public_subnets_cidr }}
          private_subnets_cidr: ${{ steps.config.outputs.tf_private_subnets_cidr }}
          azs: ${{ steps.config.outputs.tf_azs }}
          eks_version: ${{ steps.config.outputs.tf_eks_version }}
          node_instance_type: ${{ steps.config.outputs.tf_node_instance_type }}
          node_desired_capacity: ${{ steps.config.outputs.tf_node_desired_capacity }}
          node_min_capacity: ${{ steps.config.outputs.tf_node_min_capacity }}
          node_max_capacity: ${{ steps.config.outputs.tf_node_max_capacity }}
          ecr_backend_repository: ${{ steps.config.outputs.ecr_backend_repository }}
          github_actions_role_name: ${{ steps.config.outputs.github_actions_role_name }}
          github_repository: ${{ github.repository }}
          s3_security_reports_bucket: ${{ steps.config.outputs.s3_security_reports_bucket }}
          security_reports_retention_days: ${{ steps.config.outputs.security_reports_retention_days }}
          argocd_repo_url: ${{ steps.config.outputs.argocd_repo_url }}
          argocd_target_revision: ${{ steps.config.outputs.argocd_target_revision }}
          argocd_app_namespace: ${{ steps.config.outputs.argocd_app_namespace }}

      - name: Terraform Init (Persistent)
        working-directory: terraform/persistent
        timeout-minutes: 10
        run: terraform init

      - name: Terraform Plan (Persistent)
        working-directory: terraform/persistent
        timeout-minutes: 10
        run: terraform plan

      - name: "[1/3] Apply Persistent State (VPC, ECR, S3, CloudFront, IAM)"
        working-directory: terraform/persistent
        timeout-minutes: 20
        run: |
          terraform apply -auto-approve
          echo " Persistent resources applied"

  apply-cluster:
    runs-on: ubuntu-latest
    needs: apply-persistent
    timeout-minutes: 45
    
    environment: production-infra

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Load config
        id: config
        uses: ./.github/actions/load-config

      - name: Configure AWS
        uses: ./.github/actions/setup-aws
        with:
          aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Setup Terraform plugin cache directory
        run: |
          mkdir -p ~/.terraform.d/plugin-cache
          echo 'plugin_cache_dir = "$HOME/.terraform.d/plugin-cache"' > ~/.terraformrc

      - name: Cache Terraform plugins
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-plugins-${{ runner.os }}-${{ hashFiles('terraform/**/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-plugins-${{ runner.os }}-

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.config.outputs.terraform_version }}
          terraform_wrapper: false

      - name: Generate terraform.auto.tfvars.json
        uses: ./.github/actions/generate-terraform-tfvars
        with:
          aws_region: ${{ steps.config.outputs.aws_region }}
          project_name: ${{ steps.config.outputs.project_name }}
          environment: ${{ steps.config.outputs.environment }}
          vpc_cidr: ${{ steps.config.outputs.tf_vpc_cidr }}
          public_subnets_cidr: ${{ steps.config.outputs.tf_public_subnets_cidr }}
          private_subnets_cidr: ${{ steps.config.outputs.tf_private_subnets_cidr }}
          azs: ${{ steps.config.outputs.tf_azs }}
          eks_version: ${{ steps.config.outputs.tf_eks_version }}
          node_instance_type: ${{ steps.config.outputs.tf_node_instance_type }}
          node_desired_capacity: ${{ steps.config.outputs.tf_node_desired_capacity }}
          node_min_capacity: ${{ steps.config.outputs.tf_node_min_capacity }}
          node_max_capacity: ${{ steps.config.outputs.tf_node_max_capacity }}
          ecr_backend_repository: ${{ steps.config.outputs.ecr_backend_repository }}
          github_actions_role_name: ${{ steps.config.outputs.github_actions_role_name }}
          github_repository: ${{ github.repository }}
          s3_security_reports_bucket: ${{ steps.config.outputs.s3_security_reports_bucket }}
          security_reports_retention_days: ${{ steps.config.outputs.security_reports_retention_days }}
          argocd_repo_url: ${{ steps.config.outputs.argocd_repo_url }}
          argocd_target_revision: ${{ steps.config.outputs.argocd_target_revision }}
          argocd_app_namespace: ${{ steps.config.outputs.argocd_app_namespace }}

      - name: Terraform Init (Cluster)
        working-directory: terraform/cluster
        timeout-minutes: 10
        run: terraform init

      - name: Terraform Plan (Cluster)
        working-directory: terraform/cluster
        timeout-minutes: 15
        run: terraform plan

      - name: "[2/3] Apply Cluster State (EKS, Node Group, NAT)"
        working-directory: terraform/cluster
        timeout-minutes: 30
        run: |
          terraform apply -auto-approve

  apply-services:
    runs-on: ubuntu-latest
    needs: apply-cluster
    timeout-minutes: 45
    
    environment: production-infra

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Load config
        id: config
        uses: ./.github/actions/load-config

      - name: Configure AWS
        uses: ./.github/actions/setup-aws
        with:
          aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Setup Terraform plugin cache directory
        run: |
          mkdir -p ~/.terraform.d/plugin-cache
          echo 'plugin_cache_dir = "$HOME/.terraform.d/plugin-cache"' > ~/.terraformrc

      - name: Cache Terraform plugins
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-plugins-${{ runner.os }}-${{ hashFiles('terraform/**/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-plugins-${{ runner.os }}-

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.config.outputs.terraform_version }}
          terraform_wrapper: false

      - name: Generate terraform.auto.tfvars.json
        uses: ./.github/actions/generate-terraform-tfvars
        with:
          aws_region: ${{ steps.config.outputs.aws_region }}
          project_name: ${{ steps.config.outputs.project_name }}
          environment: ${{ steps.config.outputs.environment }}
          vpc_cidr: ${{ steps.config.outputs.tf_vpc_cidr }}
          public_subnets_cidr: ${{ steps.config.outputs.tf_public_subnets_cidr }}
          private_subnets_cidr: ${{ steps.config.outputs.tf_private_subnets_cidr }}
          azs: ${{ steps.config.outputs.tf_azs }}
          eks_version: ${{ steps.config.outputs.tf_eks_version }}
          node_instance_type: ${{ steps.config.outputs.tf_node_instance_type }}
          node_desired_capacity: ${{ steps.config.outputs.tf_node_desired_capacity }}
          node_min_capacity: ${{ steps.config.outputs.tf_node_min_capacity }}
          node_max_capacity: ${{ steps.config.outputs.tf_node_max_capacity }}
          ecr_backend_repository: ${{ steps.config.outputs.ecr_backend_repository }}
          github_actions_role_name: ${{ steps.config.outputs.github_actions_role_name }}
          github_repository: ${{ github.repository }}
          s3_security_reports_bucket: ${{ steps.config.outputs.s3_security_reports_bucket }}
          security_reports_retention_days: ${{ steps.config.outputs.security_reports_retention_days }}
          argocd_repo_url: ${{ steps.config.outputs.argocd_repo_url }}
          argocd_target_revision: ${{ steps.config.outputs.argocd_target_revision }}
          argocd_app_namespace: ${{ steps.config.outputs.argocd_app_namespace }}

      - name: Terraform Init (Services)
        working-directory: terraform/services
        timeout-minutes: 10
        run: terraform init

      - name: Terraform Plan (Services)
        working-directory: terraform/services
        timeout-minutes: 15
        run: terraform plan

      - name: "[3/3] Apply Services State"
        working-directory: terraform/services
        timeout-minutes: 30
        run: |
          terraform apply -auto-approve

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Configure kubectl for EKS
        timeout-minutes: 5
        run: |
          aws eks update-kubeconfig \
            --region ${{ steps.config.outputs.aws_region }} \
            --name ${{ steps.config.outputs.project_name }}

      - name: Wait for ArgoCD to be ready
        uses: jupyterhub/action-k8s-await-workloads@v3
        timeout-minutes: 15
        with:
          workloads: "deployment/argocd-server"
          namespace: "argocd"
          timeout: 600
          max-restarts: -1

      - name: Update CloudFront origin with ALB DNS
        timeout-minutes: 10
        uses: ./.github/actions/update-cloudfront-origin
        with:
          aws_region: ${{ steps.config.outputs.aws_region }}
          project_name: ${{ steps.config.outputs.project_name }}
          cloudfront_dev_distribution_id: ${{ steps.config.outputs.cloudfront_dev_distribution_id }}
          cloudfront_prod_distribution_id: ${{ steps.config.outputs.cloudfront_prod_distribution_id }}
          ingress_group_name: eventfund-shared
          origin_id: alb-internal
          timeout_minutes: '8'

      - name: Render alertmanager config with secrets
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
        run: |
          if [ -n "$ALERT_EMAIL" ] && [ -n "$ALERT_EMAIL_PASSWORD" ]; then
            export ALERT_EMAIL ALERT_EMAIL_PASSWORD
            envsubst < k8s/base/monitoring/alertmanager-config.yaml | kubectl apply -f -
            echo " Alertmanager config applied"
          else
            echo " ALERT_EMAIL or ALERT_EMAIL_PASSWORD not set, skipping alertmanager config"
          fi
