name: Manual – Infrastructure Apply

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "apply" to confirm'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  # Plan job - no approval needed, just generate plan
  terraform-plan:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'apply'
    timeout-minutes: 30

    outputs:
      plan_exitcode: ${{ steps.plan.outputs.exitcode }}
      config_aws_region: ${{ steps.config.outputs.aws_region }}
      config_project_name: ${{ steps.config.outputs.project_name }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Load config
        id: config
        uses: ./.github/actions/load-config

      - name: Configure AWS
        uses: ./.github/actions/setup-aws
        with:
          aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}

      # Setup Terraform plugin cache properly
      - name: Setup Terraform plugin cache directory
        run: |
          mkdir -p ~/.terraform.d/plugin-cache
          echo 'plugin_cache_dir = "$HOME/.terraform.d/plugin-cache"' > ~/.terraformrc

      - name: Cache Terraform plugins
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-plugins-${{ runner.os }}-${{ hashFiles('terraform/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-plugins-${{ runner.os }}-

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.config.outputs.terraform_version }}
          terraform_wrapper: false

      # Generate tfvars without logging sensitive data
      - name: Generate terraform.auto.tfvars.json
        uses: ./.github/actions/generate-terraform-tfvars
        with:
          aws_region: ${{ steps.config.outputs.aws_region }}
          project_name: ${{ steps.config.outputs.project_name }}
          environment: ${{ steps.config.outputs.environment }}
          vpc_cidr: ${{ steps.config.outputs.tf_vpc_cidr }}
          public_subnets_cidr: ${{ steps.config.outputs.tf_public_subnets_cidr }}
          private_subnets_cidr: ${{ steps.config.outputs.tf_private_subnets_cidr }}
          azs: ${{ steps.config.outputs.tf_azs }}
          eks_version: ${{ steps.config.outputs.tf_eks_version }}
          node_instance_type: ${{ steps.config.outputs.tf_node_instance_type }}
          node_desired_capacity: ${{ steps.config.outputs.tf_node_desired_capacity }}
          node_min_capacity: ${{ steps.config.outputs.tf_node_min_capacity }}
          node_max_capacity: ${{ steps.config.outputs.tf_node_max_capacity }}
          ecr_backend_repository: ${{ steps.config.outputs.ecr_backend_repository }}
          github_actions_role_name: ${{ steps.config.outputs.github_actions_role_name }}
          github_repository: ${{ github.repository }}
          s3_security_reports_bucket: ${{ steps.config.outputs.s3_security_reports_bucket }}
          security_reports_retention_days: ${{ steps.config.outputs.security_reports_retention_days }}
          argocd_repo_url: ${{ steps.config.outputs.argocd_repo_url }}
          argocd_target_revision: ${{ steps.config.outputs.argocd_target_revision }}
          argocd_app_namespace: ${{ steps.config.outputs.argocd_app_namespace }}

      - name: Terraform Init
        working-directory: terraform
        timeout-minutes: 10
        run: terraform init

      - name: Terraform Plan
        id: plan
        working-directory: terraform
        timeout-minutes: 15
        run: |
          set +e
          terraform plan -out=tfplan -detailed-exitcode
          exitcode=$?
          set -e
          
          echo "exitcode=$exitcode" >> $GITHUB_OUTPUT
          
          if [ $exitcode -eq 1 ]; then
            echo "❌ Terraform plan failed"
            exit 1
          fi
          
          exit 0

      - name: Upload plan artifact
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.run_id }}
          path: terraform/tfplan
          retention-days: 1

      - name: Generate plan summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const exitcode = '${{ steps.plan.outputs.exitcode }}';
            let summary = '## 🏗️ Terraform Plan Summary\n\n';
            
            if (exitcode === '0') {
              summary += '✅ **No changes detected** - Infrastructure is up to date\n\n';
              summary += '> Apply job will be skipped\n';
            } else if (exitcode === '2') {
              summary += '⚠️ **Changes detected** - Review required before apply\n\n';
              summary += '> **Action required:** Review the plan and approve the apply job\n\n';
              summary += '### Next Steps:\n';
              summary += '1. Download plan artifact to review changes\n';
              summary += '2. Approve the `terraform-apply` job if changes look good\n';
              summary += '3. Apply will execute the reviewed plan\n';
            } else {
              summary += '❌ **Plan failed** - Check logs for errors\n';
            }
            
            summary += `\n---\n`;
            summary += `**Run ID:** ${context.runId}\n`;
            summary += `**Triggered by:** @${context.actor}\n`;
            summary += `**Timestamp:** ${new Date().toISOString()}\n`;
            
            core.summary.addRaw(summary).write();

  # Apply job - THIS is where approval gate should be
  terraform-apply:
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: needs.terraform-plan.outputs.plan_exitcode == '2'
    timeout-minutes: 45
    
    # ✅ APPROVAL GATE HERE - after plan is reviewed
    environment:
      name: production-infra
      url: https://d2b6kmrshbsepx.cloudfront.net

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Load config
        id: config
        uses: ./.github/actions/load-config

      - name: Configure AWS
        uses: ./.github/actions/setup-aws
        with:
          aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Setup Terraform plugin cache directory
        run: |
          mkdir -p ~/.terraform.d/plugin-cache
          echo 'plugin_cache_dir = "$HOME/.terraform.d/plugin-cache"' > ~/.terraformrc

      - name: Cache Terraform plugins
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-plugins-${{ runner.os }}-${{ hashFiles('terraform/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-plugins-${{ runner.os }}-

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.config.outputs.terraform_version }}
          terraform_wrapper: false

      - name: Generate terraform.auto.tfvars.json
        uses: ./.github/actions/generate-terraform-tfvars
        with:
          aws_region: ${{ steps.config.outputs.aws_region }}
          project_name: ${{ steps.config.outputs.project_name }}
          environment: ${{ steps.config.outputs.environment }}
          vpc_cidr: ${{ steps.config.outputs.tf_vpc_cidr }}
          public_subnets_cidr: ${{ steps.config.outputs.tf_public_subnets_cidr }}
          private_subnets_cidr: ${{ steps.config.outputs.tf_private_subnets_cidr }}
          azs: ${{ steps.config.outputs.tf_azs }}
          eks_version: ${{ steps.config.outputs.tf_eks_version }}
          node_instance_type: ${{ steps.config.outputs.tf_node_instance_type }}
          node_desired_capacity: ${{ steps.config.outputs.tf_node_desired_capacity }}
          node_min_capacity: ${{ steps.config.outputs.tf_node_min_capacity }}
          node_max_capacity: ${{ steps.config.outputs.tf_node_max_capacity }}
          ecr_backend_repository: ${{ steps.config.outputs.ecr_backend_repository }}
          github_actions_role_name: ${{ steps.config.outputs.github_actions_role_name }}
          github_repository: ${{ github.repository }}
          s3_security_reports_bucket: ${{ steps.config.outputs.s3_security_reports_bucket }}
          security_reports_retention_days: ${{ steps.config.outputs.security_reports_retention_days }}
          argocd_repo_url: ${{ steps.config.outputs.argocd_repo_url }}
          argocd_target_revision: ${{ steps.config.outputs.argocd_target_revision }}
          argocd_app_namespace: ${{ steps.config.outputs.argocd_app_namespace }}

      - name: Terraform Init
        working-directory: terraform
        timeout-minutes: 10
        run: terraform init

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ github.run_id }}
          path: terraform/

      - name: Terraform Apply
        working-directory: terraform
        timeout-minutes: 30
        run: |
          # Check if plan file exists and is not stale
          if [ ! -f tfplan ]; then
            echo "❌ Plan file not found"
            exit 1
          fi
          
          # Apply the reviewed plan
          terraform apply tfplan

      # Pin kubectl version instead of 'latest'
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Configure kubectl for EKS
        timeout-minutes: 5
        run: |
          aws eks update-kubeconfig \
            --region ${{ steps.config.outputs.aws_region }} \
            --name ${{ steps.config.outputs.project_name }}

      # Pin action to commit SHA for security and specify exact workload
      - name: Wait for ArgoCD to be ready
        uses: jupyterhub/action-k8s-await-workloads@v3
        timeout-minutes: 15
        with:
          workloads: "deployment/argocd-server"
          namespace: "argocd"
          timeout: 600
          max-restarts: -1

      - name: Update CloudFront origin with ALB DNS
        timeout-minutes: 10
        uses: ./.github/actions/update-cloudfront-origin
        with:
          aws_region: ${{ steps.config.outputs.aws_region }}
          project_name: ${{ steps.config.outputs.project_name }}
          ingress_group_name: eventfund-shared
          origin_id: alb-internal
          timeout_minutes: '5'

      - name: Render alertmanager config with secrets
        timeout-minutes: 5
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
        run: |
          if [ -n "$ALERT_EMAIL" ] && [ -n "$ALERT_EMAIL_PASSWORD" ]; then
            # kubectl already configured, no need to update-kubeconfig again
            export ALERT_EMAIL ALERT_EMAIL_PASSWORD
            envsubst < k8s/base/monitoring/alertmanager-config.yaml | kubectl apply -f -
            echo "✅ Alertmanager config applied"
          else
            echo "⚠️ ALERT_EMAIL or ALERT_EMAIL_PASSWORD not set, skipping alertmanager config"
          fi
