name: Manual – Infrastructure Apply

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "apply" to confirm'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'apply'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Load config
        id: config
        uses: ./.github/actions/load-config

      - name: Configure AWS
        uses: ./.github/actions/setup-aws
        with:
          aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.config.outputs.terraform_version }}

      - name: Debug TF vars
        run: |
          echo "azs='$TF_VAR_azs'"
          echo "public='$TF_VAR_public_subnets_cidr'"
          echo "private='$TF_VAR_private_subnets_cidr'"
        env:
          TF_VAR_azs: ${{ steps.config.outputs.tf_azs }}
          TF_VAR_public_subnets_cidr: ${{ steps.config.outputs.tf_public_subnets_cidr }}
          TF_VAR_private_subnets_cidr: ${{ steps.config.outputs.tf_private_subnets_cidr }}

      - name: Generate terraform.auto.tfvars.json
        working-directory: terraform
        run: |
          cat > terraform.auto.tfvars.json <<EOF
          {
            "region": "${{ steps.config.outputs.aws_region }}",
            "project_name": "${{ steps.config.outputs.project_name }}",
            "environment": "${{ steps.config.outputs.environment }}",
            "vpc_cidr": "${{ steps.config.outputs.tf_vpc_cidr }}",
            "public_subnets_cidr": ${{ steps.config.outputs.tf_public_subnets_cidr }},
            "private_subnets_cidr": ${{ steps.config.outputs.tf_private_subnets_cidr }},
            "azs": ${{ steps.config.outputs.tf_azs }},
            "eks_version": "${{ steps.config.outputs.tf_eks_version }}",
            "node_group_instance_types": ["${{ steps.config.outputs.tf_node_instance_type }}"],
            "node_desired_capacity": ${{ steps.config.outputs.tf_node_desired_capacity }},
            "node_min_capacity": ${{ steps.config.outputs.tf_node_min_capacity }},
            "node_max_capacity": ${{ steps.config.outputs.tf_node_max_capacity }},
            "node_capacity_type": "SPOT",
            "ecr_backend_repo": "${{ steps.config.outputs.ecr_backend_repository }}",
            "ssm_prefix": "/${{ steps.config.outputs.project_name }}/${{ steps.config.outputs.environment }}/backend",
            "github_actions_role_name": "${{ steps.config.outputs.github_actions_role_name }}",
            "github_repos": ["repo:${{ github.repository }}:*"],
            "security_reports_bucket": "${{ steps.config.outputs.s3_security_reports_bucket }}",
            "security_reports_retention_days": ${{ steps.config.outputs.security_reports_retention_days }},
            "argocd_repo_url": "${{ steps.config.outputs.argocd_repo_url }}",
            "argocd_target_revision": "${{ steps.config.outputs.argocd_target_revision }}",
            "argocd_app_namespace": "${{ steps.config.outputs.argocd_app_namespace }}"
          }
          EOF
          
          echo " Generated terraform.auto.tfvars.json:"
          cat terraform.auto.tfvars.json

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply tfplan

      - name: Setup kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ steps.config.outputs.aws_region }} \
            --name ${{ steps.config.outputs.project_name }}

      - name: Wait for ArgoCD to be ready
        run: |
          echo "Waiting for ArgoCD to be ready..."
          
          for i in $(seq 1 60); do
            # Check if ArgoCD server pod is running
            ARGOCD_READY=$(kubectl get pods -n argocd -l app.kubernetes.io/name=argocd-server \
              -o jsonpath='{.items[0].status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || echo "")
            
            if [ "$ARGOCD_READY" = "True" ]; then
              echo "✅ ArgoCD is ready"
              break
            fi
            
            echo "Waiting for ArgoCD... ($i/60)"
            sleep 10
          done
          
          if [ "$ARGOCD_READY" != "True" ]; then
            echo "⚠️ ArgoCD not ready after 10 minutes, but continuing..."
          fi

      # Chờ ArgoCD sync Ingress → ALB Controller tạo ALB → lấy DNS → update CloudFront origin
      - name: Update CloudFront origin with ALB DNS
        run: |
          echo "Waiting for Ingress resources to be synced by ArgoCD..."
          
          # Đợi tối đa 5 phút cho ArgoCD sync Ingress resources
          for i in $(seq 1 30); do
            # Đếm số Ingress có annotation group.name=eventfund-shared
            INGRESS_COUNT=$(kubectl get ingress -A \
              -o json 2>/dev/null | jq -r '[.items[] | select(.metadata.annotations."alb.ingress.kubernetes.io/group.name" == "eventfund-shared")] | length' || echo "0")
            
            if [ "$INGRESS_COUNT" -gt 0 ]; then
              echo "✅ Found $INGRESS_COUNT Ingress resource(s) with group.name=eventfund-shared"
              
              # Lấy ALB DNS từ Ingress đầu tiên (tất cả Ingress cùng group dùng chung 1 ALB)
              ALB_DNS=$(kubectl get ingress -A \
                -o json 2>/dev/null | jq -r '[.items[] | select(.metadata.annotations."alb.ingress.kubernetes.io/group.name" == "eventfund-shared")] | .[0].status.loadBalancer.ingress[0].hostname' || echo "")
              
              if [ -n "$ALB_DNS" ] && [ "$ALB_DNS" != "null" ]; then
                echo "✅ ALB DNS: $ALB_DNS"
                break
              else
                echo "Ingress exists but ALB not provisioned yet, waiting..."
              fi
            else
              echo "Waiting for ArgoCD to sync Ingress... ($i/30)"
            fi
            
            sleep 10
          done

          if [ -z "$ALB_DNS" ]; then
            echo ""
            echo "⚠️ Could not get ALB DNS after 5 minutes"
            echo ""
            echo "Possible reasons:"
            echo "1. ArgoCD hasn't synced Ingress resources yet"
            echo "2. ALB Controller is still provisioning the ALB"
            echo "3. There's an issue with the Ingress configuration"
            echo ""
            echo "Current Ingress resources:"
            kubectl get ingress -A 2>/dev/null || echo "No Ingress resources found"
            echo ""
            echo "You can manually update CloudFront later with:"
            echo "  kubectl get ingress -A"
            echo "  ALB_DNS=\$(kubectl get ingress -n eventfund-dev api-ingress -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')"
            echo "  aws cloudfront update-distribution --id <CF_ID> ..."
            exit 0
          fi

          CF_ID=$(terraform -chdir=terraform output -raw cloudfront_distribution_id)
          ETAG=$(aws cloudfront get-distribution-config --id "$CF_ID" --query 'ETag' --output text)

          # Lấy config hiện tại và thêm ALB origin
          aws cloudfront get-distribution-config --id "$CF_ID" \
            --query 'DistributionConfig' --output json > /tmp/cf-config.json

          # Thêm ALB origin nếu chưa có
          python3 - <<EOF
          import json, sys

          with open('/tmp/cf-config.json') as f:
              config = json.load(f)

          alb_dns = "$ALB_DNS"
          origin_id = "alb-internal"

          # Kiểm tra origin đã tồn tại chưa
          existing = [o for o in config['Origins']['Items'] if o['Id'] == origin_id]
          if not existing:
              config['Origins']['Items'].append({
                  "Id": origin_id,
                  "DomainName": alb_dns,
                  "CustomOriginConfig": {
                      "HTTPPort": 80,
                      "HTTPSPort": 443,
                      "OriginProtocolPolicy": "http-only",
                      "OriginSslProtocols": {"Quantity": 1, "Items": ["TLSv1.2"]},
                      "OriginReadTimeout": 30,
                      "OriginKeepaliveTimeout": 5
                  },
                  "ConnectionAttempts": 3,
                  "ConnectionTimeout": 10
              })
              config['Origins']['Quantity'] = len(config['Origins']['Items'])
          else:
              # Update DNS nếu ALB đã thay đổi
              for o in config['Origins']['Items']:
                  if o['Id'] == origin_id:
                      o['DomainName'] = alb_dns

          # Thêm cache behaviors cho /argocd/*, /grafana/*, và /api/*
          behaviors = config.get('CacheBehaviors', {}).get('Items', [])
          for path, origin in [('/argocd/*', origin_id), ('/grafana/*', origin_id), ('/api/*', origin_id)]:
              if not any(b['PathPattern'] == path for b in behaviors):
                  behaviors.append({
                      "PathPattern": path,
                      "TargetOriginId": origin_id,
                      "ViewerProtocolPolicy": "redirect-to-https",
                      "AllowedMethods": {"Quantity": 7, "Items": ["GET","HEAD","OPTIONS","PUT","POST","PATCH","DELETE"], "CachedMethods": {"Quantity": 2, "Items": ["GET","HEAD"]}},
                      "CachePolicyId": "4135ea2d-6df8-44a3-9df3-4b5a84be39ad",  # CachingDisabled
                      "OriginRequestPolicyId": "216adef6-5c7f-47e4-b989-5492eafa07d3",  # AllViewer
                      "Compress": True
                  })
          config['CacheBehaviors'] = {'Quantity': len(behaviors), 'Items': behaviors}

          with open('/tmp/cf-config-updated.json', 'w') as f:
              json.dump(config, f)
          print(" CloudFront config updated")
          EOF

          aws cloudfront update-distribution \
            --id "$CF_ID" \
            --distribution-config file:///tmp/cf-config-updated.json \
            --if-match "$ETAG"
          echo " CloudFront updated with ALB origin: $ALB_DNS"

      - name: Render alertmanager config with secrets
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
        run: |
          if [ -n "$ALERT_EMAIL" ] && [ -n "$ALERT_EMAIL_PASSWORD" ]; then
            aws eks update-kubeconfig \
              --region ${{ steps.config.outputs.aws_region }} \
              --name ${{ steps.config.outputs.project_name }}
            export ALERT_EMAIL ALERT_EMAIL_PASSWORD
            envsubst < k8s/base/monitoring/alertmanager-config.yaml | kubectl apply -f -
            echo " Alertmanager config applied"
          else
            echo "⚠️ ALERT_EMAIL or ALERT_EMAIL_PASSWORD not set, skipping alertmanager config"
          fi
