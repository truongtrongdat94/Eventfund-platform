name: Manual – Infrastructure Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm'
        required: true
        type: string
      destroy_vpc:
        description: 'Also destroy VPC + NAT Gateway?'
        required: false
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'

permissions:
  contents: read
  id-token: write

jobs:
  setup:
    name: Load Config
    runs-on: ubuntu-latest
    outputs:
      aws_region:                      ${{ steps.config.outputs.aws_region }}
      project_name:                    ${{ steps.config.outputs.project_name }}
      environment:                     ${{ steps.config.outputs.environment }}
      terraform_version:               ${{ steps.config.outputs.terraform_version }}
      tf_eks_version:                  ${{ steps.config.outputs.tf_eks_version }}
      tf_node_instance_type:           ${{ steps.config.outputs.tf_node_instance_type }}
      tf_node_desired_capacity:        ${{ steps.config.outputs.tf_node_desired_capacity }}
      tf_node_min_capacity:            ${{ steps.config.outputs.tf_node_min_capacity }}
      tf_node_max_capacity:            ${{ steps.config.outputs.tf_node_max_capacity }}
      tf_vpc_cidr:                     ${{ steps.config.outputs.tf_vpc_cidr }}
      tf_public_subnets_cidr:          ${{ steps.config.outputs.tf_public_subnets_cidr }}
      tf_private_subnets_cidr:         ${{ steps.config.outputs.tf_private_subnets_cidr }}
      tf_azs:                          ${{ steps.config.outputs.tf_azs }}
      ecr_backend_repository:          ${{ steps.config.outputs.ecr_backend_repository }}
      github_actions_role_name:        ${{ steps.config.outputs.github_actions_role_name }}
      s3_security_reports_bucket:      ${{ steps.config.outputs.s3_security_reports_bucket }}
      security_reports_retention_days: ${{ steps.config.outputs.security_reports_retention_days }}
      argocd_repo_url:                 ${{ steps.config.outputs.argocd_repo_url }}
      argocd_target_revision:          ${{ steps.config.outputs.argocd_target_revision }}
      argocd_app_namespace:            ${{ steps.config.outputs.argocd_app_namespace }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: ./.github/actions/setup-aws
        with:
          aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Load config
        id: config
        uses: ./.github/actions/load-config

  destroy:
    name: Destroy Billable AWS Resources
    runs-on: ubuntu-latest
    needs: setup
    if: github.event.inputs.confirm == 'destroy'
    timeout-minutes: 60
    
    # ✅ APPROVAL GATE - destroy requires approval (more critical than apply)
    environment: production-infra

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: ./.github/actions/setup-aws
        with:
          aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}

      # Pin kubectl version for consistency
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Configure kubectl for EKS
        run: |
          if aws eks update-kubeconfig \
            --region ${{ needs.setup.outputs.aws_region }} \
            --name ${{ needs.setup.outputs.project_name }} 2>/dev/null; then
            echo "✅ kubectl configured"
          else
            echo "⚠️ EKS cluster not found or not accessible - Helm destroy will be skipped"
          fi

      # Setup Terraform plugin cache properly
      - name: Setup Terraform plugin cache directory
        run: |
          mkdir -p ~/.terraform.d/plugin-cache
          echo 'plugin_cache_dir = "$HOME/.terraform.d/plugin-cache"' > ~/.terraformrc

      - name: Cache Terraform plugins
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-plugins-${{ runner.os }}-${{ hashFiles('terraform/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-plugins-${{ runner.os }}-

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ needs.setup.outputs.terraform_version }}
          terraform_wrapper: false

      - name: Generate terraform.auto.tfvars.json
        uses: ./.github/actions/generate-terraform-tfvars
        with:
          aws_region: ${{ needs.setup.outputs.aws_region }}
          project_name: ${{ needs.setup.outputs.project_name }}
          environment: ${{ needs.setup.outputs.environment }}
          vpc_cidr: ${{ needs.setup.outputs.tf_vpc_cidr }}
          public_subnets_cidr: ${{ needs.setup.outputs.tf_public_subnets_cidr }}
          private_subnets_cidr: ${{ needs.setup.outputs.tf_private_subnets_cidr }}
          azs: ${{ needs.setup.outputs.tf_azs }}
          eks_version: ${{ needs.setup.outputs.tf_eks_version }}
          node_instance_type: ${{ needs.setup.outputs.tf_node_instance_type }}
          node_desired_capacity: ${{ needs.setup.outputs.tf_node_desired_capacity }}
          node_min_capacity: ${{ needs.setup.outputs.tf_node_min_capacity }}
          node_max_capacity: ${{ needs.setup.outputs.tf_node_max_capacity }}
          ecr_backend_repository: ${{ needs.setup.outputs.ecr_backend_repository }}
          github_actions_role_name: ${{ needs.setup.outputs.github_actions_role_name }}
          github_repository: ${{ github.repository }}
          s3_security_reports_bucket: ${{ needs.setup.outputs.s3_security_reports_bucket }}
          security_reports_retention_days: ${{ needs.setup.outputs.security_reports_retention_days }}
          argocd_repo_url: ${{ needs.setup.outputs.argocd_repo_url }}
          argocd_target_revision: ${{ needs.setup.outputs.argocd_target_revision }}
          argocd_app_namespace: ${{ needs.setup.outputs.argocd_app_namespace }}

      - name: Terraform Init
        working-directory: terraform
        timeout-minutes: 10
        run: terraform init

      # Destroy Helm releases first to trigger cleanup of ALB/ENIs
      # GitHub Actions role now has EKS access entry → can authenticate with cluster
      # Helm destroy → kubectl delete ingress → ALB Controller cleanup ALB + SG → ENIs released
      - name: "[1/4] Destroy Helm releases"
        id: destroy_helm
        working-directory: terraform
        continue-on-error: true
        timeout-minutes: 20
        run: terraform destroy -target=module.helm -auto-approve

      - name: Wait for ALB + ENI cleanup
        timeout-minutes: 10
        run: |
          echo "Waiting for ALB Controller to cleanup ALB/ENI..."
          sleep 30
          
          # Get VPC ID from Terraform output
          VPC_ID=$(terraform -chdir=terraform output -raw vpc_id 2>/dev/null || echo "")
          
          if [ -n "$VPC_ID" ]; then
            echo "Checking for remaining Load Balancers in VPC: $VPC_ID"
            
            # Count remaining ALBs
            LB_COUNT=$(aws elbv2 describe-load-balancers \
              --region ${{ needs.setup.outputs.aws_region }} \
              --query "length(LoadBalancers[?VpcId=='$VPC_ID'])" \
              --output text 2>/dev/null || echo "0")
            
            echo "Remaining Load Balancers: $LB_COUNT"
            
            # Force delete remaining ALBs
            if [ "$LB_COUNT" -gt 0 ]; then
              echo "Force deleting remaining Load Balancers..."
              aws elbv2 describe-load-balancers \
                --region ${{ needs.setup.outputs.aws_region }} \
                --query "LoadBalancers[?VpcId=='$VPC_ID'].LoadBalancerArn" \
                --output text | tr '\t' '\n' | grep -v '^$' | while read arn; do
                  echo "Deleting LB: $arn"
                  aws elbv2 delete-load-balancer --load-balancer-arn "$arn" --region ${{ needs.setup.outputs.aws_region }} 2>/dev/null || true
                done
              
              echo "Waiting 60s for Load Balancers to be fully deleted..."
              sleep 60
            fi
            
            # Delete orphaned security groups created by ALB Controller
            echo "Cleaning up orphaned security groups..."
            SG_IDS=$(aws ec2 describe-security-groups \
              --region ${{ needs.setup.outputs.aws_region }} \
              --filters "Name=vpc-id,Values=$VPC_ID" "Name=tag-key,Values=elbv2.k8s.aws/cluster" \
              --query "SecurityGroups[*].GroupId" \
              --output text 2>/dev/null || echo "")
            
            for SG in $SG_IDS; do
              echo "Deleting security group: $SG"
              aws ec2 delete-security-group --group-id "$SG" --region ${{ needs.setup.outputs.aws_region }} 2>/dev/null || true
            done
          fi
          
          echo "ALB/ENI cleanup completed"

      - name: Remove Helm resources from Terraform state
        working-directory: terraform
        timeout-minutes: 5
        run: |
          # Backup state before modification
          terraform state pull > /tmp/terraform-state-backup-$(date +%Y%m%d-%H%M%S).json
          
          echo "Removing Helm resources from state to prevent provider initialization errors..."
          echo "⚠️ Note: state rm only removes from state, does not destroy actual resources"
          
          # Automatically remove all helm_release and null_resource from module.helm
          # Required because helm/null_resource cause provider init errors when destroying individual modules
          terraform state list | grep -E '(helm_release|null_resource)' | grep 'module\.helm' | while read resource; do
            echo "Removing from state (not destroying): $resource"
            terraform state rm "$resource" 2>/dev/null || true
          done
          
          echo "✅ Helm resources removed from state"

      - name: "[2/4] Destroy IAM IRSA roles"
        id: destroy_iam
        working-directory: terraform
        continue-on-error: true
        timeout-minutes: 15
        run: terraform destroy -target=module.iam -auto-approve

      - name: "[3/4] Destroy EKS cluster"
        id: destroy_eks
        working-directory: terraform
        timeout-minutes: 30
        run: |
          # -refresh=false: skip state sync to avoid timeout when cluster is being deleted
          # May need to run terraform plan afterwards to verify no resources remain
          terraform destroy -target=module.eks -auto-approve -refresh=false

      - name: "[4/4] Destroy VPC + NAT Gateway + EIP"
        id: destroy_vpc
        if: github.event.inputs.destroy_vpc == 'yes'
        working-directory: terraform
        timeout-minutes: 30
        run: |
          MAX_RETRIES=3
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Attempt $((RETRY_COUNT + 1))/$MAX_RETRIES to destroy VPC..."
            
            # -refresh=false: skip state sync to avoid timeout when resources are being deleted
            # May need manual cleanup if resources remain after max retries
            if terraform destroy -target=module.vpc -auto-approve -refresh=false; then
              echo "VPC destroyed successfully"
              exit 0
            fi
            
            RETRY_COUNT=$((RETRY_COUNT + 1))
            
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              WAIT_TIME=$((30 * RETRY_COUNT))
              echo "Destroy failed, waiting ${WAIT_TIME}s before retry..."
              echo "Checking for remaining dependencies..."
              
              # Check for remaining ENIs
              VPC_ID=$(terraform output -raw vpc_id 2>/dev/null || echo "")
              if [ -n "$VPC_ID" ]; then
                ENI_COUNT=$(aws ec2 describe-network-interfaces \
                  --region ${{ needs.setup.outputs.aws_region }} \
                  --filters "Name=vpc-id,Values=$VPC_ID" \
                  --query "length(NetworkInterfaces)" \
                  --output text 2>/dev/null || echo "0")
                echo "Remaining ENIs in VPC: $ENI_COUNT"
              fi
              
              sleep $WAIT_TIME
            fi
          done
          
          echo "Failed to destroy VPC after $MAX_RETRIES attempts"
          echo "Manual cleanup may be required"
          exit 1

      - name: Summary
        if: always()
        run: |
          echo "## Destroy Report" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Status | Saving |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY

          [[ "${{ steps.destroy_helm.outcome }}" == "success" ]] \
            && echo "| Helm (ALB, ArgoCD, Prometheus) | Destroyed | ~\$0.02/hr |" >> $GITHUB_STEP_SUMMARY \
            || echo "| Helm (ALB, ArgoCD, Prometheus) | Skipped/Failed | – |" >> $GITHUB_STEP_SUMMARY

          [[ "${{ steps.destroy_iam.outcome }}" == "success" ]] \
            && echo "| IAM IRSA roles | Destroyed | \$0 (free) |" >> $GITHUB_STEP_SUMMARY \
            || echo "| IAM IRSA roles | Skipped/Failed | – |" >> $GITHUB_STEP_SUMMARY

          [[ "${{ steps.destroy_eks.outcome }}" == "success" ]] \
            && echo "| EKS + nodes | Destroyed | ~\$0.27/hr |" >> $GITHUB_STEP_SUMMARY \
            || echo "| EKS + nodes | Failed – still running! | – |" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ github.event.inputs.destroy_vpc }}" == "yes" ]]; then
            [[ "${{ steps.destroy_vpc.outcome }}" == "success" ]] \
              && echo "| VPC + NAT Gateway + EIP | Destroyed | ~\$0.05/hr |" >> $GITHUB_STEP_SUMMARY \
              || echo "| VPC + NAT Gateway + EIP | Failed – still running! | – |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| VPC + NAT Gateway + EIP | Kept | \$0.05/hr still running |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Kept: ECR, S3, CloudFront, SSM, IAM, OIDC" >> $GITHUB_STEP_SUMMARY
          echo "Redeploy: Run Manual – Infrastructure Apply workflow" >> $GITHUB_STEP_SUMMARY
