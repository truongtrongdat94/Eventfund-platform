name: Reusable – Deploy Backend

on:
  workflow_call:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy (commit SHA from CI run).'
        type: string
        required: true
      environment:
        description: 'Target environment (dev or prod).'
        type: string
        default: 'dev'
      branch:
        description: 'Branch to commit GitOps change back to (matches CI run branch).'
        type: string
        required: true
    secrets:
      AWS_ACCOUNT_ID:
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Uses GitHub Environments — configure prod approval rules in repo Settings → Environments.
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Configure AWS
        uses: ./.github/actions/setup-aws
        with:
          aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Load config
        id: config
        uses: ./.github/actions/load-config
        with:
          environment: ${{ inputs.environment }}

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Render backend ConfigMap into overlay
        env:
          # Pin NODE_ENV per environment — overlay value, not in public_env.yml.
          NODE_ENV: ${{ inputs.environment == 'prod' && 'PROD' || 'DEV' }}
          BACKEND_PORT: ${{ steps.config.outputs.k8s_backend_port }}
          LOG_LEVEL: ${{ steps.config.outputs.k8s_log_level }}
          RATE_LIMIT_WINDOW_MS: ${{ steps.config.outputs.k8s_rate_limit_window_ms }}
          RATE_LIMIT_MAX_REQUESTS: ${{ steps.config.outputs.k8s_rate_limit_max_requests }}
          AUTH_RATE_LIMIT_MAX: ${{ steps.config.outputs.k8s_auth_rate_limit_max }}
          MIN_DEPOSIT_VND: ${{ steps.config.outputs.k8s_min_deposit_vnd }}
          MAX_DEPOSIT_VND: ${{ steps.config.outputs.k8s_max_deposit_vnd }}
          DEPOSIT_ORDER_EXPIRY_MINUTES: ${{ steps.config.outputs.k8s_deposit_order_expiry_minutes }}
          AUTO_EVENT_LIFECYCLE_ENABLED: ${{ steps.config.outputs.k8s_auto_event_lifecycle_enabled }}
          AUTO_EVENT_LIFECYCLE_INTERVAL_MS: ${{ steps.config.outputs.k8s_auto_event_lifecycle_interval_ms }}
          AUTO_EVENT_LIFECYCLE_SCAN_LIMIT: ${{ steps.config.outputs.k8s_auto_event_lifecycle_scan_limit }}
          AUTO_TICKETING_DEFAULT_TYPE: ${{ steps.config.outputs.k8s_auto_ticketing_default_type }}
          CHAIN_LOG_CHUNK_SIZE: ${{ steps.config.outputs.k8s_chain_log_chunk_size }}
          JWT_EXPIRES_IN: ${{ steps.config.outputs.k8s_jwt_expires_in }}
          SIWE_CHAIN_ID: ${{ steps.config.outputs.k8s_siwe_chain_id }}
          DELEGATED_SIG_CHAIN_ID: ${{ steps.config.outputs.k8s_delegated_sig_chain_id }}
          DELEGATED_SIG_DOMAIN_NAME: ${{ steps.config.outputs.k8s_delegated_sig_domain_name }}
          DELEGATED_SIG_DOMAIN_VERSION: ${{ steps.config.outputs.k8s_delegated_sig_domain_version }}
          RELAYER_REQUIRE_CREATE_EVENT_SIGNATURE: ${{ steps.config.outputs.k8s_relayer_require_create_event_signature }}
          RELAYER_REQUIRE_ADMIN_STATUS_SIGNATURE: ${{ steps.config.outputs.k8s_relayer_require_admin_status_signature }}
          CONTRACTS_ARTIFACTS_DIR: ${{ steps.config.outputs.k8s_contracts_artifacts_dir }}
          WEB3AUTH_NETWORK: ${{ steps.config.outputs.k8s_web3auth_network }}
        run: |
          set -euo pipefail
          OVERLAY_DIR="k8s/overlays/${{ inputs.environment }}"
          TEMPLATE="k8s/base/backend/configmap.yaml.tpl"
          TARGET="${OVERLAY_DIR}/backend-configmap-patch.yaml"

          if [ ! -f "$TEMPLATE" ]; then
            echo "Template not found: $TEMPLATE"
            exit 1
          fi

          envsubst < "$TEMPLATE" > "$TARGET"
          echo "Rendered $TARGET"

      - name: Update image tag in overlay kustomization.yaml
        env:
          ECR_URL: ${{ steps.config.outputs.ecr_backend_repository_url }}
          NEW_TAG: ${{ inputs.image_tag }}
          OVERLAY: k8s/overlays/${{ inputs.environment }}/kustomization.yaml
        run: |
          set -euo pipefail

          yq -i \
            '(.images[] | select(.name == "eventfund-backend").newName) = strenv(ECR_URL)
             | (.images[] | select(.name == "eventfund-backend").newTag) = strenv(NEW_TAG)' \
            "$OVERLAY"

          echo "Updated overlay image to: ${ECR_URL}:${NEW_TAG}"

          kustomize build "k8s/overlays/${{ inputs.environment }}" > /dev/null \
            || { echo "kustomize build failed"; exit 1; }

      - name: Commit and push overlay changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci(deploy): update ${{ inputs.environment }} backend image to ${{ inputs.image_tag }}"
          file_pattern: |
            k8s/overlays/${{ inputs.environment }}/kustomization.yaml
            k8s/overlays/${{ inputs.environment }}/backend-configmap-patch.yaml
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
          commit_author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>

      - name: Verify EKS rollout (kubectl rollout status)
        env:
          NAMESPACE: ${{ steps.config.outputs.namespace }}
          AWS_REGION: ${{ steps.config.outputs.aws_region }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          ECR_URL: ${{ steps.config.outputs.ecr_backend_repository_url }}
        run: |
          set -euo pipefail

          # Single EKS cluster (named after project) hosts both dev/prod via separate namespaces.
          CLUSTER_NAME="${{ steps.config.outputs.project_name }}"
          echo "Updating kubeconfig for cluster: ${CLUSTER_NAME}"
          aws eks update-kubeconfig --region "${AWS_REGION}" --name "${CLUSTER_NAME}"

          # Wait for ArgoCD to pick up the commit and patch the deployment image,
          # then watch rollout. Bounded by step timeout (default 25m for the job).
          DEADLINE=$((SECONDS + 600))   # 10 min wait for ArgoCD pickup
          EXPECTED="${ECR_URL}:${IMAGE_TAG}"
          echo "Waiting for deployment/api in ${NAMESPACE} to reach image ${EXPECTED}"

          while [ $SECONDS -lt $DEADLINE ]; do
            CURRENT=$(kubectl -n "${NAMESPACE}" get deployment/api \
              -o jsonpath='{.spec.template.spec.containers[?(@.name=="api")].image}' 2>/dev/null || echo "")
            if [ "${CURRENT}" = "${EXPECTED}" ]; then
              echo "ArgoCD has applied target image."
              break
            fi
            echo "Current: '${CURRENT}'  (target ${EXPECTED}) — waiting..."
            sleep 15
          done

          if [ "${CURRENT:-}" != "${EXPECTED}" ]; then
            echo "ArgoCD did not apply target image within 10 minutes."
            kubectl -n "${NAMESPACE}" describe deployment/api | tail -50
            exit 1
          fi

          kubectl -n "${NAMESPACE}" rollout status deployment/api --timeout=10m
