name: Reusable – Deploy Backend

on:
  workflow_call:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy'
        type: string
        required: true
      environment:
        description: 'Environment to deploy to'
        type: string
        default: 'dev'
    secrets:
      AWS_ACCOUNT_ID:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Configure AWS
        uses: ./.github/actions/setup-aws
        with:
          aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Load config
        id: config
        uses: ./.github/actions/load-config

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Render K8s manifests with environment values
        run: |
          export ENVIRONMENT="${{ steps.config.outputs.environment }}"
          export AWS_REGION="${{ steps.config.outputs.aws_region }}"
          export BACKEND_PORT="${{ steps.config.outputs.k8s_backend_port }}"
          export LOG_LEVEL="${{ steps.config.outputs.k8s_log_level }}"
          export RATE_LIMIT_WINDOW_MS="${{ steps.config.outputs.k8s_rate_limit_window_ms }}"
          export RATE_LIMIT_MAX_REQUESTS="${{ steps.config.outputs.k8s_rate_limit_max_requests }}"
          export AUTH_RATE_LIMIT_MAX="${{ steps.config.outputs.k8s_auth_rate_limit_max }}"
          export MIN_DEPOSIT_VND="${{ steps.config.outputs.k8s_min_deposit_vnd }}"
          export MAX_DEPOSIT_VND="${{ steps.config.outputs.k8s_max_deposit_vnd }}"
          export DEPOSIT_ORDER_EXPIRY_MINUTES="${{ steps.config.outputs.k8s_deposit_order_expiry_minutes }}"
          export AUTO_EVENT_LIFECYCLE_ENABLED="${{ steps.config.outputs.k8s_auto_event_lifecycle_enabled }}"
          export AUTO_EVENT_LIFECYCLE_INTERVAL_MS="${{ steps.config.outputs.k8s_auto_event_lifecycle_interval_ms }}"
          export AUTO_EVENT_LIFECYCLE_SCAN_LIMIT="${{ steps.config.outputs.k8s_auto_event_lifecycle_scan_limit }}"
          export AUTO_TICKETING_DEFAULT_TYPE="${{ steps.config.outputs.k8s_auto_ticketing_default_type }}"
          export CHAIN_LOG_CHUNK_SIZE="${{ steps.config.outputs.k8s_chain_log_chunk_size }}"
          export JWT_EXPIRES_IN="${{ steps.config.outputs.k8s_jwt_expires_in }}"
          export SIWE_CHAIN_ID="${{ steps.config.outputs.k8s_siwe_chain_id }}"
          export DELEGATED_SIG_CHAIN_ID="${{ steps.config.outputs.k8s_delegated_sig_chain_id }}"
          export DELEGATED_SIG_DOMAIN_NAME="${{ steps.config.outputs.k8s_delegated_sig_domain_name }}"
          export DELEGATED_SIG_DOMAIN_VERSION="${{ steps.config.outputs.k8s_delegated_sig_domain_version }}"
          export RELAYER_REQUIRE_CREATE_EVENT_SIGNATURE="${{ steps.config.outputs.k8s_relayer_require_create_event_signature }}"
          export RELAYER_REQUIRE_ADMIN_STATUS_SIGNATURE="${{ steps.config.outputs.k8s_relayer_require_admin_status_signature }}"
          export CONTRACTS_ARTIFACTS_DIR="${{ steps.config.outputs.k8s_contracts_artifacts_dir }}"
          export WEB3AUTH_NETWORK="${{ steps.config.outputs.k8s_web3auth_network }}"

          for f in k8s/base/backend/configmap.yaml k8s/base/secrets/externalsecret-backend.yaml k8s/base/secrets/secretstore.yaml; do
            envsubst < "$f" > "$f.rendered" && mv "$f.rendered" "$f"
          done

      - name: Update image tag in kustomization.yaml
        run: |
          ECR_URL="${{ steps.config.outputs.ecr_backend_repository_url }}"
          cd k8s/base

          # Dùng sed thay vì kustomize edit để tránh làm hỏng cấu trúc YAML khi có comments
          # Chỉ update dòng newTag của image eventfund-backend
          sed -i "/name: eventfund-backend/,/newTag:/ s|newTag:.*|newTag: ${{ inputs.image_tag }}|" kustomization.yaml

          # Update newName nếu ECR URL thay đổi
          sed -i "/name: eventfund-backend/,/newName:/ s|newName:.*|newName: ${ECR_URL}|" kustomization.yaml

          echo "Updated image to: ${ECR_URL}:${{ inputs.image_tag }}"

          # Validate file không bị corrupt
          kustomize build . > /dev/null || { echo " kustomization.yaml is invalid after edit"; exit 1; }

      # Use git-auto-commit-action for cleaner git operations
      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci(deploy): update backend image to ${{ inputs.image_tag }}"
          file_pattern: 'k8s/base/kustomization.yaml k8s/base/backend/configmap.yaml k8s/base/secrets/externalsecret-backend.yaml k8s/base/secrets/secretstore.yaml'
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
          commit_author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          skip_dirty_check: false
          skip_fetch: false
          skip_checkout: false
          disable_globbing: false
          create_branch: false
