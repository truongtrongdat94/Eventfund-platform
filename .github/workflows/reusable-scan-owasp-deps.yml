name: Reusable – OWASP Dependency-Check

on:
  workflow_call:
    inputs:
      path:
        description: 'Path to scan (default: entire project)'
        type: string
        default: '.'

jobs:
  owasp-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # Required for uploading SARIF to Security tab

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Cache OWASP NVD database to speed up scans
      # Cache key based on OS + dependency files for reusability
      # NVD database updates independently, but cache is still beneficial
      - name: Cache OWASP NVD database
        uses: actions/cache@v4
        with:
          path: ~/.gradle/dependency-check-data
          key: owasp-nvd-${{ runner.os }}-${{ hashFiles('**/pom.xml', '**/package-lock.json', '**/yarn.lock', '**/Gemfile.lock') }}
          restore-keys: |
            owasp-nvd-${{ runner.os }}-

      # Run OWASP Dependency-Check
      # Generates SARIF for GitHub Security tab
      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@1.1.0
        with:
          project: 'eventfund-platform'
          path: ${{ inputs.path }}
          format: 'SARIF'
          out: 'reports'
          args: >
            --failOnCVSS 7
            --exclude "**/node_modules/**"
            --exclude "**/dist/**"
            --exclude "**/build/**"
            --exclude "**/coverage/**"

      # Upload SARIF to GitHub Security tab
      - name: Upload SARIF to GitHub Security
        if: always() && hashFiles('reports/*.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/dependency-check-report.sarif
          category: owasp-dependency-check

      # Upload reports as GitHub Artifacts
      - name: Upload reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-reports-${{ github.run_id }}
          path: reports/
          retention-days: 30
