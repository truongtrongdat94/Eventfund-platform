name: Reusable – Deploy Frontend

on:
  workflow_call:
    secrets:
      AWS_ACCOUNT_ID:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Load config
        id: config
        uses: ./.github/actions/load-config

      - name: Configure AWS
        uses: ./.github/actions/setup-aws
        with:
          aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Pull frontend env from SSM
        shell: bash
        run: |
          set -euo pipefail
          SSM_PREFIX="/eventfund/${{ steps.config.outputs.environment }}/frontend"
          ENV_FILE="frontend/.env"
          aws ssm get-parameters-by-path \
            --path "$SSM_PREFIX" \
            --recursive \
            --with-decryption \
            --region ${{ steps.config.outputs.aws_region }} \
            --query 'Parameters[*].[Name,Value]' \
            --output json > /tmp/ssm.json
          jq -r '.[] | @tsv' /tmp/ssm.json > /tmp/ssm.tsv
          while IFS=$(printf '\t') read -r name value; do
            KEY=$(echo "$name" | sed "s|^$SSM_PREFIX/||")
            echo "${KEY}=${value}" >> "$ENV_FILE"
          done < /tmp/ssm.tsv
          rm -f /tmp/ssm.json /tmp/ssm.tsv

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.config.outputs.node_version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      # Use S3 sync action with optimizations
      - name: Upload to S3
        uses: jakejarvis/s3-sync-action@v0.5.1
        with:
          args: --follow-symlinks --delete --cache-control "public,max-age=31536000,immutable"
        env:
          AWS_S3_BUCKET: ${{ steps.config.outputs.frontend_s3_bucket }}
          AWS_REGION: ${{ steps.config.outputs.aws_region }}
          SOURCE_DIR: frontend/dist

      # Get CloudFront distribution ID by querying S3 bucket origin
      - name: Get CloudFront distribution ID
        id: cloudfront
        shell: bash
        run: |
          BUCKET="${{ steps.config.outputs.frontend_s3_bucket }}"
          DIST_ID=$(aws cloudfront list-distributions --output json | \
            jq -r ".DistributionList.Items[] | select(.Origins.Items[].DomainName | contains(\"${BUCKET}\")) | .Id" | \
            head -n 1)
          
          if [ -z "$DIST_ID" ]; then
            echo "❌ CloudFront distribution not found for bucket: ${BUCKET}"
            exit 1
          fi
          
          echo "distribution_id=${DIST_ID}" >> $GITHUB_OUTPUT
          echo "✅ Found distribution: ${DIST_ID}"

      # Use CloudFront invalidation action
      - name: Invalidate CloudFront cache
        uses: chetan/invalidate-cloudfront-action@v2
        env:
          DISTRIBUTION: ${{ steps.cloudfront.outputs.distribution_id }}
          PATHS: "/*"
          AWS_REGION: ${{ steps.config.outputs.aws_region }}
