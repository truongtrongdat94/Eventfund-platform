name: Reusable – Deploy Frontend

on:
  workflow_call:
    inputs:
      image_tag:
        description: 'Commit SHA from the CI run (used for checkout to lock to CI revision).'
        type: string
        required: true
      environment:
        description: 'Target environment (dev or prod).'
        type: string
        default: 'dev'
      workflow_run_id:
        description: 'CI workflow_run.id used to download the pre-built frontend artifact.'
        type: string
        required: true
    secrets:
      AWS_ACCOUNT_ID:
        required: true

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}

    steps:
      # Pin checkout to CI commit SHA, not the branch tip — prevents race where a newer
      # commit landed on the branch between CI completion and CD start.
      - name: Checkout repo at CI revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.image_tag }}
          persist-credentials: false

      - name: Load config
        id: config
        uses: ./.github/actions/load-config
        with:
          environment: ${{ inputs.environment }}

      - name: Configure AWS
        uses: ./.github/actions/setup-aws
        with:
          aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          aws_region: ${{ steps.config.outputs.aws_region }}

      # Download the dist/ artifact built by CI for the same commit instead of rebuilding.
      # This guarantees byte-for-byte identical output to what CI tested.
      - name: Download frontend artifact from CI run
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ inputs.image_tag }}
          path: frontend/dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.workflow_run_id }}

      - name: Upload to S3
        run: |
          set -euo pipefail
          aws s3 sync frontend/dist/ "s3://${{ steps.config.outputs.frontend_s3_bucket }}/" \
            --follow-symlinks \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --region "${{ steps.config.outputs.aws_region }}"

      - name: Invalidate CloudFront cache
        uses: chetan/invalidate-cloudfront-action@v2
        env:
          DISTRIBUTION: ${{ steps.config.outputs.cloudfront_distribution_id }}
          PATHS: "/*"
          AWS_REGION: ${{ steps.config.outputs.aws_region }}
