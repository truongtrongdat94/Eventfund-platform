name: Upload Security Reports
description: Upload security scan reports to GitHub Artifacts and S3

inputs:
  scan_id:
    description: 'Unique scan ID'
    required: true
  tool:
    description: 'Tool name (owasp-dependency-check, sonarqube, trivy)'
    required: true
  reports_path:
    description: 'Path to reports directory'
    required: true
  s3_bucket:
    description: 'S3 bucket name (optional, loads from config if not provided)'
    required: false
  s3_path:
    description: 'S3 path (without bucket)'
    required: true
  retention_days:
    description: 'GitHub Artifacts retention days'
    required: false
    default: '30'
  upload_to_s3:
    description: 'Whether to upload to S3'
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Verify reports exist
      shell: bash
      run: |
        if [ ! -d "${{ inputs.reports_path }}" ]; then
          echo " Reports directory not found: ${{ inputs.reports_path }}"
          exit 1
        fi

        echo "📁 Reports directory contents:"
        ls -lah "${{ inputs.reports_path }}"

    - name: Upload to GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.tool }}-report-${{ inputs.scan_id }}
        path: ${{ inputs.reports_path }}
        retention-days: ${{ inputs.retention_days }}

    - name: Load S3 config
      if: inputs.upload_to_s3 == 'true'
      id: s3_config
      shell: bash
      run: |
        CONFIG_FILE="${{ github.action_path }}/../../config/public_env.yml"

        S3_BUCKET="${{ inputs.s3_bucket }}"
        if [ -z "$S3_BUCKET" ]; then
          if [ -f "$CONFIG_FILE" ]; then
            S3_BUCKET=$(yq '.s3.security_reports_bucket' "$CONFIG_FILE")
          else
            echo " S3 bucket not provided and config file not found"
            exit 1
          fi
        fi

        echo "bucket=${S3_BUCKET}" >> $GITHUB_OUTPUT
        echo "📦 S3 Bucket: ${S3_BUCKET}"

    - name: Upload to S3
      if: inputs.upload_to_s3 == 'true'
      shell: bash
      run: |
        set -euo pipefail

        S3_DEST="s3://${{ steps.s3_config.outputs.bucket }}/${{ inputs.s3_path }}/"

        echo "📤 Uploading reports to S3..."
        echo "  Source: ${{ inputs.reports_path }}"
        echo "  Destination: ${S3_DEST}"

        aws s3 sync "${{ inputs.reports_path }}/" "${S3_DEST}" \
          --metadata "scan-id=${{ inputs.scan_id }},tool=${{ inputs.tool }},branch=${{ github.ref_name }},commit=${{ github.sha }}" \
          --no-progress

        echo " Uploaded to: ${S3_DEST}"
        echo ""
        echo " S3 Contents:"
        aws s3 ls "${S3_DEST}" --recursive --human-readable

    - name: Generate summary
      shell: bash
      run: |
        cat >> $GITHUB_STEP_SUMMARY <<EOF
        ## 📊 Security Scan Reports Uploaded

        ### Scan Information
        - **Tool**: \`${{ inputs.tool }}\`
        - **Scan ID**: \`${{ inputs.scan_id }}\`
        - **Branch**: \`${{ github.ref_name }}\`
        - **Commit**: \`${{ github.sha }}\`

        ### Artifacts
        - **GitHub Actions**: \`${{ inputs.tool }}-report-${{ inputs.scan_id }}\`
        - **Retention**: ${{ inputs.retention_days }} days
        EOF

        if [ "${{ inputs.upload_to_s3 }}" == "true" ]; then
          cat >> $GITHUB_STEP_SUMMARY <<EOF
        - **S3 Path**: \`s3://${{ steps.s3_config.outputs.bucket }}/${{ inputs.s3_path }}/\`

        ### Download from S3
        \`\`\`bash
        # Download all reports
        aws s3 sync s3://${{ steps.s3_config.outputs.bucket }}/${{ inputs.s3_path }}/ ./reports/

        # Download metadata only
        aws s3 cp s3://${{ steps.s3_config.outputs.bucket }}/${{ inputs.s3_path }}/metadata.json ./
        \`\`\`
        EOF
        fi
