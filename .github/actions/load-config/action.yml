name: Load Configuration
description: Load configuration from centralized public_env.yml file

inputs:
  environment:
    description: 'Environment to load config for (dev or prod)'
    required: false
    default: 'dev'

outputs:
  project_name:
    description: 'Project name'
    value: ${{ steps.load.outputs.project_name }}
  environment:
    description: 'Deployment environment'
    value: ${{ steps.load.outputs.environment }}
  namespace:
    description: 'Kubernetes namespace for the environment'
    value: ${{ steps.load.outputs.namespace }}
  frontend_branch:
    description: 'Git branch for the environment'
    value: ${{ steps.load.outputs.frontend_branch }}
  aws_region:
    description: 'AWS Region'
    value: ${{ steps.load.outputs.aws_region }}
  aws_oidc_role_name:
    description: 'AWS OIDC Role Name'
    value: ${{ steps.load.outputs.aws_oidc_role_name }}
  ecr_backend_repository:
    description: 'ECR Backend Repository'
    value: ${{ steps.load.outputs.ecr_backend_repository }}
  ecr_backend_repository_url:
    description: 'ECR Backend Repository full URL (account.dkr.ecr.region.amazonaws.com/repo)'
    value: ${{ steps.load.outputs.ecr_backend_repository_url }}
  frontend_s3_bucket:
    description: 'S3 bucket name for frontend static assets'
    value: ${{ steps.load.outputs.frontend_s3_bucket }}
  cloudfront_distribution_id:
    description: 'CloudFront distribution ID for frontend'
    value: ${{ steps.load.outputs.cloudfront_distribution_id }}
  cloudfront_dev_distribution_id:
    description: 'CloudFront Dev distribution ID'
    value: ${{ steps.load.outputs.cloudfront_dev_distribution_id }}
  cloudfront_prod_distribution_id:
    description: 'CloudFront Prod distribution ID'
    value: ${{ steps.load.outputs.cloudfront_prod_distribution_id }}
  argocd_repo_url:
    description: 'ArgoCD Git repo URL'
    value: ${{ steps.load.outputs.argocd_repo_url }}
  argocd_target_revision:
    description: 'ArgoCD target revision (branch)'
    value: ${{ steps.load.outputs.argocd_target_revision }}
  argocd_app_namespace:
    description: 'ArgoCD application namespace'
    value: ${{ steps.load.outputs.argocd_app_namespace }}
  s3_security_reports_bucket:
    description: 'S3 Security Reports Bucket'
    value: ${{ steps.load.outputs.s3_security_reports_bucket }}
  s3_deploy_tmp_bucket_prefix:
    description: 'S3 Deploy Temp Bucket Prefix'
    value: ${{ steps.load.outputs.s3_deploy_tmp_bucket_prefix }}
  node_version:
    description: 'Node.js version'
    value: ${{ steps.load.outputs.node_version }}
  sonarcloud_project_key:
    description: 'SonarCloud project key'
    value: ${{ steps.load.outputs.sonarcloud_project_key }}
  sonarcloud_organization:
    description: 'SonarCloud organization'
    value: ${{ steps.load.outputs.sonarcloud_organization }}
  sonarcloud_base_url:
    description: 'SonarCloud base URL'
    value: ${{ steps.load.outputs.sonarcloud_base_url }}
  github_actions_role_name:
    description: 'IAM role name for GitHub Actions'
    value: ${{ steps.load.outputs.github_actions_role_name }}
  terraform_version:
    description: 'Terraform version to use'
    value: ${{ steps.load.outputs.terraform_version }}
  security_reports_retention_days:
    description: 'Security reports retention days'
    value: ${{ steps.load.outputs.security_reports_retention_days }}
  tf_eks_version:
    description: 'Terraform EKS version'
    value: ${{ steps.load.outputs.tf_eks_version }}
  tf_node_instance_type:
    description: 'Terraform node instance type'
    value: ${{ steps.load.outputs.tf_node_instance_type }}
  tf_node_desired_capacity:
    description: 'Terraform node desired capacity'
    value: ${{ steps.load.outputs.tf_node_desired_capacity }}
  tf_node_min_capacity:
    description: 'Terraform node min capacity'
    value: ${{ steps.load.outputs.tf_node_min_capacity }}
  tf_node_max_capacity:
    description: 'Terraform node max capacity'
    value: ${{ steps.load.outputs.tf_node_max_capacity }}
  tf_vpc_cidr:
    description: 'Terraform VPC CIDR'
    value: ${{ steps.load.outputs.tf_vpc_cidr }}
  tf_public_subnets_cidr:
    description: 'Terraform public subnets CIDR'
    value: ${{ steps.load.outputs.tf_public_subnets_cidr }}
  tf_private_subnets_cidr:
    description: 'Terraform private subnets CIDR'
    value: ${{ steps.load.outputs.tf_private_subnets_cidr }}
  tf_azs:
    description: 'Terraform availability zones'
    value: ${{ steps.load.outputs.tf_azs }}

runs:
  using: composite
  steps:
    - name: Install yq (if not exists)
      shell: bash
      run: |
        if ! command -v yq &> /dev/null; then
          echo "Installing yq..."
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
        else
          echo "yq already installed"
        fi

    - name: Load configuration
      id: load
      shell: bash
      run: |
        CONFIG_FILE="${{ github.action_path }}/../../config/public_env.yml"

        if [ ! -f "$CONFIG_FILE" ]; then
          echo " Config file not found: $CONFIG_FILE"
          exit 1
        fi

        echo "📋 Loading configuration from: $CONFIG_FILE"

        # Determine environment from input or default
        ENVIRONMENT="${{ inputs.environment }}"
        echo "🎯 Target environment: ${ENVIRONMENT}"

        # Project
        echo "project_name=$(yq '.project.name' $CONFIG_FILE)" >> $GITHUB_OUTPUT
        echo "environment=${ENVIRONMENT}" >> $GITHUB_OUTPUT

        # Environment-specific configs (namespace from vars, branch stays in YAML)
        if [ "${ENVIRONMENT}" = "prod" ]; then
          NAMESPACE="${{ vars.K8S_NAMESPACE_PROD }}"
          FRONTEND_BUCKET="${{ vars.FRONTEND_BUCKET_PROD }}"
          CLOUDFRONT_DIST_ID="${{ vars.CLOUDFRONT_DIST_ID_PROD }}"
        else
          NAMESPACE="${{ vars.K8S_NAMESPACE_DEV }}"
          FRONTEND_BUCKET="${{ vars.FRONTEND_BUCKET_DEV }}"
          CLOUDFRONT_DIST_ID="${{ vars.CLOUDFRONT_DIST_ID_DEV }}"
        fi
        echo "namespace=${NAMESPACE}" >> $GITHUB_OUTPUT
        echo "frontend_branch=$(yq ".environments.${ENVIRONMENT}.branch" $CONFIG_FILE)" >> $GITHUB_OUTPUT

        # AWS (from vars)
        AWS_REGION="${{ vars.AWS_REGION }}"
        echo "aws_region=${AWS_REGION}" >> $GITHUB_OUTPUT
        echo "aws_oidc_role_name=${{ vars.AWS_OIDC_ROLE_NAME }}" >> $GITHUB_OUTPUT

        # ECR (from vars)
        ECR_REPO="${{ vars.ECR_BACKEND_REPOSITORY }}"
        echo "ecr_backend_repository=${ECR_REPO}" >> $GITHUB_OUTPUT
        AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text 2>/dev/null || echo "")
        echo "ecr_backend_repository_url=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}" >> $GITHUB_OUTPUT

        # S3 (from vars)
        echo "s3_security_reports_bucket=${{ vars.S3_SECURITY_REPORTS_BUCKET }}" >> $GITHUB_OUTPUT
        echo "s3_deploy_tmp_bucket_prefix=${{ vars.S3_DEPLOY_TMP_BUCKET_PREFIX }}" >> $GITHUB_OUTPUT

        # Environment-specific S3 bucket (from vars)
        echo "frontend_s3_bucket=${FRONTEND_BUCKET}" >> $GITHUB_OUTPUT
        echo " Using S3 bucket: ${FRONTEND_BUCKET}"

        # Environment-specific CloudFront distribution ID (from vars)
        echo "cloudfront_distribution_id=${CLOUDFRONT_DIST_ID}" >> $GITHUB_OUTPUT
        echo " Using CloudFront distribution: ${CLOUDFRONT_DIST_ID}"

        # Both dev and prod CloudFront distribution IDs (from vars)
        echo "cloudfront_dev_distribution_id=${{ vars.CLOUDFRONT_DIST_ID_DEV }}" >> $GITHUB_OUTPUT
        echo "cloudfront_prod_distribution_id=${{ vars.CLOUDFRONT_DIST_ID_PROD }}" >> $GITHUB_OUTPUT

        # ArgoCD
        echo "argocd_repo_url=$(yq '.argocd.repo_url' $CONFIG_FILE)" >> $GITHUB_OUTPUT
        echo "argocd_target_revision=$(yq '.argocd.target_revision' $CONFIG_FILE)" >> $GITHUB_OUTPUT
        echo "argocd_app_namespace=$(yq '.argocd.app_namespace' $CONFIG_FILE)" >> $GITHUB_OUTPUT

        # Node
        echo "node_version=$(yq '.node.version' $CONFIG_FILE)" >> $GITHUB_OUTPUT

        # SonarCloud
        echo "sonarcloud_project_key=$(yq '.sonarcloud.project_key' $CONFIG_FILE)" >> $GITHUB_OUTPUT
        echo "sonarcloud_organization=$(yq '.sonarcloud.organization' $CONFIG_FILE)" >> $GITHUB_OUTPUT
        echo "sonarcloud_base_url=$(yq '.sonarcloud.base_url' $CONFIG_FILE)" >> $GITHUB_OUTPUT

        # Terraform infra config
        echo "tf_eks_version=$(yq '.terraform.eks_version' $CONFIG_FILE)" >> $GITHUB_OUTPUT
        echo "tf_node_instance_type=$(yq '.terraform.node_instance_type' $CONFIG_FILE)" >> $GITHUB_OUTPUT
        echo "tf_node_desired_capacity=$(yq '.terraform.node_desired_capacity' $CONFIG_FILE)" >> $GITHUB_OUTPUT
        echo "tf_node_min_capacity=$(yq '.terraform.node_min_capacity' $CONFIG_FILE)" >> $GITHUB_OUTPUT
        echo "tf_node_max_capacity=$(yq '.terraform.node_max_capacity' $CONFIG_FILE)" >> $GITHUB_OUTPUT
        echo "tf_vpc_cidr=${{ vars.TF_VPC_CIDR }}" >> $GITHUB_OUTPUT
        echo "tf_public_subnets_cidr=${{ vars.TF_PUBLIC_SUBNETS_CIDR }}" >> $GITHUB_OUTPUT
        echo "tf_private_subnets_cidr=${{ vars.TF_PRIVATE_SUBNETS_CIDR }}" >> $GITHUB_OUTPUT
        echo "tf_azs=${{ vars.TF_AZS }}" >> $GITHUB_OUTPUT

        # GitHub Actions role (from vars), terraform version, security reports retention
        echo "github_actions_role_name=${{ vars.AWS_OIDC_ROLE_NAME }}" >> $GITHUB_OUTPUT
        echo "terraform_version=$(yq '.terraform.terraform_version' $CONFIG_FILE)" >> $GITHUB_OUTPUT
        echo "security_reports_retention_days=$(yq '.terraform.security_reports_retention_days' $CONFIG_FILE)" >> $GITHUB_OUTPUT

        # K8s config values (non-sensitive only — see public_env.yml for what stays inline).
        # Sensitive runtime values (rate limits, deposit limits, JWT/SIWE/EIP-712 config,
        # relayer flags, web3auth network) are pulled at runtime from AWS SSM Parameter Store
        # via ExternalSecret. Do not add them back here.
        echo "k8s_backend_port=$(yq '.k8s.backend_port' $CONFIG_FILE)" >> $GITHUB_OUTPUT
        echo "k8s_log_level=$(yq '.k8s.log_level' $CONFIG_FILE)" >> $GITHUB_OUTPUT
        echo "k8s_auto_event_lifecycle_enabled=$(yq '.k8s.auto_event_lifecycle_enabled' $CONFIG_FILE)" >> $GITHUB_OUTPUT
        echo "k8s_auto_event_lifecycle_interval_ms=$(yq '.k8s.auto_event_lifecycle_interval_ms' $CONFIG_FILE)" >> $GITHUB_OUTPUT
        echo "k8s_auto_event_lifecycle_scan_limit=$(yq '.k8s.auto_event_lifecycle_scan_limit' $CONFIG_FILE)" >> $GITHUB_OUTPUT
        echo "k8s_auto_ticketing_default_type=$(yq '.k8s.auto_ticketing_default_type' $CONFIG_FILE)" >> $GITHUB_OUTPUT
        echo "k8s_chain_log_chunk_size=$(yq '.k8s.chain_log_chunk_size' $CONFIG_FILE)" >> $GITHUB_OUTPUT
        echo "k8s_contracts_artifacts_dir=$(yq '.k8s.contracts_artifacts_dir' $CONFIG_FILE)" >> $GITHUB_OUTPUT

        echo " Configuration loaded successfully for environment: ${ENVIRONMENT}"
